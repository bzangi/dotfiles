# ~/.config/starship-light.toml
# Prompt de duas linhas otimizado pra fundo CLARO.
# Cores em hex (truecolor — Ghostty suporta nativamente; paleta Gojo Limitless).
# Requer Nerd Font para os ícones renderizarem.
#
# Trocar entre light/dark: comando `theme light` ou `theme dark` no shell.

# Layout duas linhas:
#   linha 1 (diretorio): folder + path + git + node ... fill ... aws (extrema direita)
#   linha 2 (input): prompt + hora na direita
# $fill empurra o $aws pra borda direita da LINHA 1 (do diretório). O right_format
# (hora) cai na LINHA DE INPUT — é o RPROMPT do zsh. Ambos recalculam no resize.
format = """
[╭─](#94a3b8) $directory$git_branch$git_status$nodejs$fill$aws
[╰─](#94a3b8)$character"""
right_format = "$time"

# Mantém linha em branco antes de cada prompt (respiração visual)
add_newline = true

# Folga pro spawn de comandos de módulo (ex: `node --version` do [nodejs]).
# Default é 500ms; o flip de appearance do macOS (comando `theme`) gera um pico
# de CPU/IO que pode atrasar o 1º spawn e disparar WARN "command timed out".
command_timeout = 1000

[character]
format = "$symbol "
success_symbol = "[❯](#7c3aed)"
error_symbol   = "[❯](#dc2626)"

[directory]
# Fora de repo git: path truncado aos 3 últimos componentes
format = "[ ](#4f46e5)[$path]($style) "
style  = "fg=#4f46e5"
truncation_length = 3
truncation_symbol = "…/"

# Dentro de repo git: mostra "repo-name/sub/path" — corta o $before_root_path
# (que seria "~/code/" ou similar). Nome do repo em negrito pra destacar.
truncate_to_repo = true
# Nota: dentro de repo_root_format o $style do módulo não resolve, então
# hardcoda o hex no $path. O repo_root usa $repo_root_style (bold + cor).
repo_root_format = "[ ](#4f46e5)[$repo_root]($repo_root_style)[$path](#4f46e5) "
repo_root_style  = "bold #4f46e5"

[git_branch]
format = "[ $branch](#059669)"
symbol = ""

# Indicador de "sujo" — qualquer mudança vira ✗ vermelho terra
[git_status]
format = "[ $all_status$ahead_behind]($style) "
style  = "fg=#dc2626"
modified   = "✗"
untracked  = "*"
staged     = "+"
conflicted = "="
ahead      = "[⇡${count}](bold #db2777)"
behind     = "[⇣${count}](bold #db2777)"
diverged   = "[⇕](bold #db2777)"
stashed    = ""
deleted    = "✘"
renamed    = "»"

# Só aparece quando o cwd (ou ancestral) tem package.json/.nvmrc/node_modules
[nodejs]
format = "[ $version](#059669) "
symbol = ""
detect_extensions = []  # sobrescreve default ["js","ts",...] — só triggers explícitos abaixo
detect_files   = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

# Só aparece quando $profile não-vazio — `(...)` é grupo opcional do Starship:
# se qualquer variável dentro estiver vazia, o grupo todo some.
# force_display=true faz o módulo sempre processar (default só ativa se
# AWS_ACCESS_KEY_ID setado, o que não é o padrão usando SSO/aws-vault).
[aws]
format = "([󰸏 $profile](#d97706) )"
symbol = ""
force_display = true

# Empurra o $aws pra borda direita da linha 1 (preenche com espaço).
[fill]
symbol = " "

[time]
disabled    = false
format      = "[$time]($style)"
style       = "fg=#64748b"
time_format = "%H:%M"
