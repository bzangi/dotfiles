# ~/.config/starship-dark.toml
# Prompt de duas linhas otimizado pra fundo ESCURO.
# Espelho do starship-light.toml — só as cores mudam.

format = """
[╭─](#475569) $directory$git_branch$git_status$nodejs$fill$aws
[╰─](#475569)$character"""
right_format = "$time"

add_newline = true

# Folga pro spawn de comandos de módulo (ex: `node --version` do [nodejs]).
# Default é 500ms; o flip de appearance do macOS (comando `theme`) gera um pico
# de CPU/IO que pode atrasar o 1º spawn e disparar WARN "command timed out".
command_timeout = 1000

[character]
format = "$symbol "
success_symbol = "[❯](#a78bfa)"
error_symbol   = "[❯](#f87171)"

[directory]
format = "[ ](#818cf8)[$path]($style) "
style  = "fg=#818cf8"
truncation_length = 3
truncation_symbol = "…/"

truncate_to_repo = true
repo_root_format = "[ ](#818cf8)[$repo_root]($repo_root_style)[$path](#818cf8) "
repo_root_style  = "bold #818cf8"

[git_branch]
format = "[ $branch](#34d399)"
symbol = ""

[git_status]
format = "[ $all_status$ahead_behind]($style) "
style  = "fg=#f87171"
modified   = "✗"
untracked  = "*"
staged     = "+"
conflicted = "="
ahead      = "[⇡${count}](bold #f472b6)"
behind     = "[⇣${count}](bold #f472b6)"
diverged   = "[⇕](bold #f472b6)"
stashed    = ""
deleted    = "✘"
renamed    = "»"

[nodejs]
format = "[ $version](#34d399) "
symbol = ""
detect_extensions = []  # sobrescreve default ["js","ts",...] — só triggers explícitos abaixo
detect_files   = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[aws]
format = "([󰸏 $profile](#fbbf24) )"
symbol = ""
force_display = true

# Empurra o $aws pra borda direita da linha 1 (preenche com espaço).
[fill]
symbol = " "

[time]
disabled    = false
format      = "[$time]($style)"
style       = "fg=#64748b"
time_format = "%H:%M"
